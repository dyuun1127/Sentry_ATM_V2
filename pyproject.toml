[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentry-atm"
version = "0.1.0"
description = "Predictive ATC decision-support PoC for an RKTU terminal simulation area"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Team Sejong" },
]
dependencies = []

[project.optional-dependencies]
persistence = [
    "SQLAlchemy>=2.0.52,<2.1",
]
# 규정 엔진(sentry_atm.regulation)의 결정론 판정은 표준 라이브러리만 쓴다.
# 학습·해석적 확률 계층만 아래 패키지를 필요로 하며, 전부 함수 안에서 지연
# 임포트하므로 이 그룹 없이도 모듈 임포트와 규정 판정은 그대로 동작한다.
learning = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "torch>=2.4",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sentry_atm.infrastructure.http" = ["static/*"]
"sentry_atm.regulation" = ["reference/*.json"]

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: exercises multiple components with a real local resource",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["sentry_atm"]

[tool.coverage.report]
show_missing = true
skip_covered = true
